# E2: Five-level core break-even sweep (the main result)
# ~2,940 policy-parameter combinations × 20 replications
# Estimated runtime: 1–3 CPU-hours with Numba kernel
# Run: python -m triageq.run --config configs/e2.yaml

experiment: e2
description: "Five-level break-even surfaces (Figures F3, F4; Table T4)"

K: 5
pi: from_data    # survey-weighted rESI-O mix from data/processed/pi_resi_o.json
tau_min: [5, 15, 30, 60, 120]

service:
  family: exponential
  mean_min: 20.0
  level_multipliers: null   # S0: common exponential baseline

rho: [0.50, 0.60, 0.70, 0.80, 0.85, 0.90, 0.95]
servers: [1, 5]

# Ordinal error model grid
sigma:
  start: 0.0
  stop:  2.0
  step:  0.1    # plan grid: 21 points on [0, 2]
  # Beyond the plan's grid: tail break-evens lie at sigma > 2 (HA Youden J is still 0.32 at sigma = 2)
  extra: [2.25, 2.5, 2.75, 3.0, 3.5, 4.0, 5.0, 6.0, 8.0, 10.0, 12.0, 15.0, 20.0]
bias: [-0.5, -0.25, 0.0, 0.25, 0.5]

policies: [fifo, np_pq, apq, oracle]
apq_weights: [16.0, 8.0, 4.0, 2.0, 1.0]

n_patients:
  default: 100000
  high_load: 250000
  high_load_threshold: 0.9

warmup_frac: 0.10
replications: 20
master_seed: 20260925

engine: fast    # Numba kernel for sweeps

output_dir: results/e2/
